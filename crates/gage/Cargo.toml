[package]
name = "gage"
description = "gage library: vaults, entries, sessions. No terminal I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test fixtures (gittest) for other crates' tests. gage-cli enables it as a
# dev-dependency; the shipped binary never does.
test-support = []

[dependencies]
# Q-GIT-CRATE: vendored libgit2 and OpenSSL, and a static zlib, so the
# binary needs no system git libraries. Q-SSH: `ssh` adds libssh2 (always
# built from its bundled source) for best-effort ssh-agent auth only.
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
libz-sys = { version = "1", features = ["static"] }
humantime = "2"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
age = "0.12.1"
zeroize = "1"
# remoteauth's remote-URL parsing. Already in the graph through git2's
# `cred` feature.
url = "2"
saphyr = { version = "0.2", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std"] }
saphyr-parser = "0.2"
# `generate`'s OS CSPRNG (OsRng). The same rand_core age already pulls in.
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
serde_json = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"
# Q-SSH: libssh2 links OpenSSL on Unix (WinCNG on Windows). Vendored here
# explicitly rather than relying on libgit2-sys's feature wiring.
libssh2-sys = { version = "0.3", features = ["vendored-openssl"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_System_SystemInformation"] }
