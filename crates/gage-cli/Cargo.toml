[package]
name = "gage-cli"
description = "gage command-line frontend (binary: gage)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/distillerylabs/gage-rs/tree/main/doc/cli"
readme = "README.md"
keywords = ["age", "git", "secrets", "password-manager", "cli"]
categories = ["command-line-utilities", "cryptography"]
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "gage"
path = "src/main.rs"

# The binary's docs page is a pointer to the README, not an API: the crate
# docs in lib.rs say so.
[package.metadata.docs.rs]
all-features = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
gage = { package = "gage-core", path = "../gage", version = "0.1.0" }
# init's default device name; std has no hostname call.
hostname = "0.4"
# `log` renders commit times in the local zone, which needs jiff to find it;
# the library keeps its instants zone-free. Windows has no tz database to
# read, so jiff bundles one there.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
rpassword = "7.5"
# The session's line editor (ADR-0050). No default features: gage
# owns the history file itself (0600, append-only), so rustyline's
# file history and its home-directory lookup aren't needed.
rustyline = { version = "19.0.0", default-features = false }
# $EDITOR's PATH lookup before any scratch file exists (ADR-0036); handles
# Windows PATHEXT.
which = "8"
tempfile = "3"
uuid = "1"
zeroize = "1"
# `-c/--clip` (ADR-0035): in-process on every platform, so the value
# never passes through a child process. No image support; Wayland through
# data-control.
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
# A one-shot `-c`'s Ctrl-C, installed only for its wait.
ctrlc = "3.5.2"
# `-q/--qr` (ADR-0049): encoding only, no image rendering.
qrcode = { version = "0.14.1", default-features = false }
# The clipboard keeper remembers a digest of what it wrote, never the value.
sha2 = "0.11"
subtle = "2"
# Typed refusals a caller can match through `CliError::downcast_ref`.
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
gage = { package = "gage-core", path = "../gage", version = "0.1.0", features = ["test-support"] }
portable-pty = "0.9"
age = "0.12.1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
jiff = { version = "0.2", default-features = false, features = ["tzdb-bundle-platform"] }
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }
