[package]
name = "gage-cli"
description = "gage command-line frontend (binary: gage)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gage"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
gage = { path = "../gage" }
# init's default device name; std has no hostname call.
hostname = "0.4"
rpassword = "7.5"
# $EDITOR's PATH lookup before any scratch file exists (Q-EDITOR); handles
# Windows PATHEXT.
which = "8"
tempfile = "3"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
gage = { path = "../gage", features = ["test-support"] }
thiserror = "2"
portable-pty = "0.9"
age = "0.12.1"
uuid = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }
