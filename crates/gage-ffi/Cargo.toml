[package]
name = "gage-ffi"
description = "Swift and Kotlin bindings for gage-core, generated by UniFFI (ADR-0060)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Not published: how the bindings are distributed is undecided (ADR-0060).
publish = false

[lib]
name = "gage_ffi"
# `lib` for tests and uniffi-bindgen's library mode; `staticlib` for the
# iOS XCFramework.
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The binding generator's CLI (and its clap); never in the library build.
bindgen = ["uniffi/cli"]

# Not a cargo-dist release artifact: only gage-cli ships binaries.
[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
gage = { package = "gage-core", path = "../gage", version = "0.1.1" }
thiserror = "2"
# Proc-macro mode only, no UDL (ADR-0060).
uniffi = "0.32"
uuid = "1"
zeroize = "1"

[dev-dependencies]
gage = { package = "gage-core", path = "../gage", version = "0.1.1", features = ["test-support"] }
tempfile = "3"
