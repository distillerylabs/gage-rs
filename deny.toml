# Config for cargo-deny, run by `make audit` and CI's audit workflow.
#
# Supply-chain policy: known-vulnerable or yanked dependencies, licences we
# can't ship under Apache-2.0, surprise dependency sources, and wildcard
# versions.
# (The library-purity half of that setup is clippy.toml; the dependency half
# is crates/gage/tests/no_frontend_deps.rs.)

[graph]
all-features = true

[advisories]
# Vulnerabilities are always errors. Yanked releases are too, since a
# yanked version is the maintainer saying "do not use this".
yanked = "deny"
# Only flag unmaintained crates that the workspace depends on directly: a
# transitive one is rarely actionable from here, and still shows in the
# RustSec report if someone goes looking.
unmaintained = "workspace"
# Each entry carries its reason and the issue that removes it.
ignore = [
    # crypto-bigint 0.5.5 reaches us only through age 0.12.1 -> p256 0.13 /
    # hpke 0.12 -> elliptic-curve 0.13. age's latest release pins that line,
    # so the fixed crypto-bigint (>= 0.7.6) is unreachable until age
    # releases on p256 0.14. gage uses only age's x25519 and scrypt types,
    # never the p256/hpke recipients. Remove once age is updated (#98).
    { id = "RUSTSEC-2026-0387", reason = "unreachable via age 0.12.1's p256/hpke, which gage does not use; see #98" },
]

[licenses]
# gage-rs is Apache-2.0, so everything it ships must be compatible with
# that. Extended deliberately, one reviewed licence at a time, when a new
# dependency needs one.
allow = [
    "Apache-2.0",
    "MIT",
    # The ICU crates git2 reaches through url -> idna (ADR-0014).
    "Unicode-3.0",
    # age's x25519-dalek / curve25519-dalek (ADR-0022).
    "BSD-3-Clause",
    # foldhash, through hashlink, through saphyr (ADR-0048).
    "Zlib",
    # clipboard-win and error-code, rustyline's Windows-only dependencies.
    # Permissive, OSI-approved, Apache-2.0 compatible.
    "BSL-1.0",
]
confidence-threshold = 0.93
# MPL-2.0 for UniFFI's own crates only, not workspace-wide: gage-ffi needs
# them (ADR-0060). It is file-level copyleft, so shipping them binds only
# changes to UniFFI's own files, never gage's code. A new crate under that
# licence still needs its own review.
exceptions = [
    { crate = "uniffi", allow = ["MPL-2.0"] },
    { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },
    { crate = "uniffi_core", allow = ["MPL-2.0"] },
    { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_meta", allow = ["MPL-2.0"] },
    { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
    { crate = "uniffi_udl", allow = ["MPL-2.0"] },
]

[bans]
# Reported, not failed: two versions of a crate is a build-size nit, not a
# defect, and the graph can't always be unified.
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path, with no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
