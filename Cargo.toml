[workspace]
resolver = "3"
members = ["crates/gage", "crates/gage-cli", "crates/reset-local-state"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/distillerylabs/gage-rs"
publish = false

# Syscall-level modules (memlock, vaultlock on Windows) opt in locally with
# #[allow(unsafe_code)] when they arrive; nothing else may use unsafe.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every `unsafe` block carries a `// SAFETY:` comment saying why it is sound.
undocumented_unsafe_blocks = "warn"

# scrypt is ~50x slower unoptimized: a debug build took 36 s for one pass at
# the shipped work factor (19) and 0.73 s in release, and every scrypt
# identity or recipient also runs age's own calibration pass. Optimizing
# just the KDF's crates keeps `make test` (and the guard test that writes a
# real factor-19 file) at release speed without slowing the rest of the
# debug build. Measured on the shipped work factor.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
