name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs on the same PR; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Its own workflow, rather than a step in test.yml, so it gets its own
# status badge. Still run across the full OS matrix: clippy only analyzes
# code whose cfg matches the platform it runs on, so the platform-specific
# code (memlock, vaultlock, ...) is only linted natively.
jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: rustup toolchain install
        shell: bash

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # windows-latest doesn't ship GNU make; see test.yml.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: make lint
        run: make lint
        shell: bash

      # Proves the library-purity lint still fires; see scripts/lint-selftest.sh.
      - name: make lint-selftest
        run: make lint-selftest
        shell: bash

      # The crates must stay publishable. Ubuntu only: packaging doesn't
      # vary by platform. gage-cli can't be published as a dry run until
      # gage-core is on the registry, so it is only packaged (listed).
      - name: cargo publish --dry-run (gage-core)
        if: runner.os == 'Linux'
        run: cargo publish --dry-run --locked -p gage-core
        shell: bash

      - name: cargo package --list (gage-cli)
        if: runner.os == 'Linux'
        run: cargo package --list --locked -p gage-cli
        shell: bash

      # The library docs docs.rs will build must have no broken links.
      - name: cargo doc (gage-core)
        if: runner.os == 'Linux'
        run: cargo doc --locked --no-deps -p gage-core
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings

      # The pinned cargo-dist, for dist-check below; keyed on the Makefile
      # so a pin change reinstalls it.
      - name: Cache tool binaries
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: lint-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # release.yml is dist's output plus scripts/dist/release.yml.patch,
      # nothing else. Ubuntu only: the generated file is the same anywhere.
      - name: make dist-check
        if: runner.os == 'Linux'
        run: make dist-check
        shell: bash

  # The rust-version promise: the crates build on the oldest compiler they
  # claim. `check` without --all-targets, since the promise covers building
  # the crates, not their dev-dependencies. See ADR-0058.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.95 --profile minimal
        shell: bash

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo +1.95 check
        run: cargo +1.95 check --locked -p gage-core -p gage-cli
        shell: bash
